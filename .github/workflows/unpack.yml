name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip
        run: |
          rm -f layout.js package.json page.js route.js server.js
          unzip -o aayu-editor.zip
          cp -r aayu-editor/. .
          rm -rf aayu-editor aayu-editor.zip
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project"
          git push
